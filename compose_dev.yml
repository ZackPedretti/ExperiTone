services:
  experitone-api:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    restart: always
    container_name: experitone-api
    ports:
      - "2570:2570"
    environment:
      - ASPNETCORE_URLS=http://+:2570
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./experitone-api/experitone-api:/src
    working_dir: /src
    command: dotnet watch run --urls=http://+:2570
    depends_on:
      elasticsearch:
        condition: service_healthy

  experitone-app:
    image: node:24.6.0
    restart: always
    container_name: experitone-app
    ports:
      - 3000:3000
    volumes:
      - ./experitone-app:/src
      - /src/node_modules
    working_dir: /src
    command: sh -c "npm i && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    restart: always
    container_name: experitone-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -Eq ''"status":"(yellow|green)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.2
    restart: always
    container_name: experitone-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres
    container_name: experitone-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERSECRET}
      POSTGRES_DB: experitone-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: experitone-adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  esdata:
